<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="ruan.ico.ico" type="image/x-icon">
    <title>Tags HTML</title>
</head>
<body>
    <H1>Tags HTML</H1>
    <P>Em HTML5, podemos inserir os elementos da lista a seguir. Passe o mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.</P>
    <ul type="square">
        <li><abbr title="Use a tag <p>">Parágrafo</abbr></li>
        <li><abbr title="Use a tag <h1>,<h2>,<h3>,<h4>,<h5>,<h6>">Títulos</abbr></li>
        <li><abbr title="Use a tag <img>">Imagens</abbr></li>
        <li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="Use a tag <ol>">Lista númerada</abbr></li>
        <li><abbr title="Use a tag <ul>">Lista com Demarcações</abbr></li>
    </ul>
</body>
</html>
